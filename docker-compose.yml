services:
  # Desarrollo: Next.js dev server directo
  web-taagbio-dev:
    container_name: web-taagbio-dev
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: deps
    ports:
      - "${WEB_TAAGBIO_DEV_PORT:-8001}:3000"
      - "${WEB_TAAGBIO_DEV_SSL_PORT:-4001}:443"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHAT_IA_WEBPAGE_API_URL=${CHAT_IA_WEBPAGE_API_URL:-}
      - CHAT_IA_WEBPAGE_SERVICE_KEY=${CHAT_IA_WEBPAGE_SERVICE_KEY:-}
    command: npm run dev
    profiles:
      - dev

  # Produccion: Next.js + nginx TLS
  web-taagbio:
    container_name: web-taagbio
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: runner
    ports:
      - "${WEB_TAAGBIO_SSL_PORT:-443}:443"
      - "${WEB_TAAGBIO_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CHAT_IA_WEBPAGE_API_URL=${CHAT_IA_WEBPAGE_API_URL}
      - CHAT_IA_WEBPAGE_SERVICE_KEY=${CHAT_IA_WEBPAGE_SERVICE_KEY}
    profiles:
      - prod
