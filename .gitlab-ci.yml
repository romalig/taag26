# Build production image and push as latest
build_latest:
  stage: build-latest
  environment:
    name: production
  variables:
    IMG_TAG_FINAL: $IMAGE_NAME:latest
  script:
    - echo "Building production image with tag 'latest'"
    - docker build --build-arg
      NEXT_PUBLIC_APIWEBSITE_URL="$NEXT_PUBLIC_APIWEBSITE_URL" --build-arg
      NEXT_PUBLIC_APIWEBSITE_SERVICE_KEY="$NEXT_PUBLIC_APIWEBSITE_SERVICE_KEY"
      --build-arg
      NEXT_PUBLIC_TXALAB_LOGIN_URL="${NEXT_PUBLIC_TXALAB_LOGIN_URL:-https://txalab.taag-genetics.com}"
      --build-arg
      NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://www.taag.bio}"
      --build-arg CHAT_IA_WEBPAGE_API_URL="$CHAT_IA_WEBPAGE_API_URL" --build-arg
      CHAT_IA_WEBPAGE_SERVICE_KEY="$CHAT_IA_WEBPAGE_SERVICE_KEY" -t
      $IMG_TAG_FINAL . -f .docker/Dockerfile
    - docker push $IMG_TAG_FINAL
  # needs: ["backup_latest"]
  only:
    - master
  tags:
    - docker
  timeout: 4h

# Deploy to production (manual trigger)
deploy_production:
  stage: deploy
  environment:
    name: production
  script:
    - echo "Triggering production deploy webhook"
    - apk add --no-cache curl
    - curl -k -X POST $REPGITT_WEBHOOK_URL_PROD
  needs:
    - build_latest
  when: manual
  only:
    - master
  tags:
    - docker