# CI/CD Pipeline — TAAG Bio Frontend
# Builds Docker images and deploys via webhook

stages:
  - build-dev
  - deploy-dev
  - build-latest
  - deploy

variables:
  IMAGE_NAME: $REPGITLAB_REGISTRY_URL/comercial-pages/taag-bio/taag-site
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ''

default:
  image: docker:26.1.1
  services:
    - docker:26.1.1-dind
  before_script:
    - echo "$REPGIT_REGISTRY_PASS_GPOTAAGBIO" | docker login
      $REPGITLAB_REGISTRY_URL -u "$REPGIT_REGISTRY_USR_GPOTAAGBIO"
      --password-stdin

# ── Desarrollo ──────────────────────────────────────────

# Build dev image and push as dev
build_dev:
  stage: build-dev
  environment:
    name: desarrollo
  variables:
    IMG_TAG_FINAL: $IMAGE_NAME:dev
  script:
    - echo "Building dev image with tag 'dev'"
    - docker build --build-arg
      NEXT_PUBLIC_APIWEBSITE_URL="$NEXT_PUBLIC_APIWEBSITE_URL" --build-arg
      NEXT_PUBLIC_APIWEBSITE_SERVICE_KEY="$NEXT_PUBLIC_APIWEBSITE_SERVICE_KEY"
      --build-arg
      NEXT_PUBLIC_TXALAB_LOGIN_URL="${NEXT_PUBLIC_TXALAB_LOGIN_URL:-https://txalab.taag-genetics.com}"
      --build-arg
      NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://www.taag.bio}"
      -t $IMG_TAG_FINAL . -f .docker/Dockerfile
    - docker push $IMG_TAG_FINAL
  only:
    - desarrollo
  tags:
    - docker
  timeout: 4h

# Deploy to development (manual trigger)
deploy_development:
  stage: deploy-dev
  environment:
    name: desarrollo
  script:
    - echo "Triggering development deploy webhook"
    - apk add --no-cache curl
    - curl -k -X POST $REPGITT_WEBHOOK_URL_DEV
  needs:
    - build_dev
  when: manual
  only:
    - desarrollo
  tags:
    - docker

# ── Producción ──────────────────────────────────────────

